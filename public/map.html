<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <title>Mapa zgłoszeń – Hulajdusza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { height: 100%; }
    #map { background: hsl(var(--muted)); }
    .maplibregl-popup-content { border-radius: .5rem; background: hsl(var(--card)); color: hsl(var(--foreground)); font-size: 13px; padding: 10px 14px; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: hsl(var(--card)); }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: hsl(var(--card)); }
  </style>
</head>
<body class="flex flex-col">
  <header class="z-[1000] border-b border-default bg-[hsl(var(--background))]/95 backdrop-blur">
    <div class="max-w-md mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="text-base font-bold tracking-tight whitespace-nowrap">😈 Hulajdusza</a>
      <nav class="flex items-center gap-3 whitespace-nowrap">
        <a href="/" class="text-sm text-muted hover:text-[hsl(var(--foreground))] transition-colors">Zgłoś</a>
        <a href="/map" class="text-sm font-medium">Mapa</a>
        <a href="/stats" class="text-sm text-muted hover:text-[hsl(var(--foreground))] transition-colors">Statystyki</a>
        <button type="button" data-theme-toggle class="grid place-items-center w-10 h-10 -mr-2 text-muted hover:text-[hsl(var(--foreground))] transition-colors" aria-label="Zmień motyw"></button>
      </nav>
    </div>
  </header>

  <main class="flex-1 relative">
    <div id="map" class="absolute inset-0"></div>
    <div class="absolute left-3 bottom-10 z-[1000] max-w-[calc(100%-1.5rem)] rounded-lg border border-default bg-[hsl(var(--background))]/90 backdrop-blur p-3 space-y-2 shadow-sm">
      <p id="stats" class="text-xs text-muted"></p>
      <ul id="legend" class="flex flex-wrap gap-x-4 gap-y-1 text-xs"></ul>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const dark = isDark();
    addEventListener("themechange", () => location.reload());
    const map = new maplibregl.Map({
      container: "map",
      style: `https://tiles.openfreemap.org/styles/${dark ? "dark" : "positron"}`,
      center: [21.0122, 52.2297],
      zoom: 11.5,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

    // Centrowanie na lokalizacji użytkownika (tylko gdy jest w Warszawie – poza nią zostaje widok miasta)
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      fitBoundsOptions: { maxZoom: 15 },
      showAccuracyCircle: false,
    });
    map.addControl(geolocate, "top-right");
    const inWarsaw = (lat, lng) => lat > 52.0 && lat < 52.4 && lng > 20.75 && lng < 21.35;
    function centerOnMe() {
      navigator.geolocation?.getCurrentPosition(
        ({ coords }) => {
          if (!inWarsaw(coords.latitude, coords.longitude)) return;
          map.jumpTo({ center: [coords.longitude, coords.latitude], zoom: 14 });
          geolocate.trigger(); // pokazuje niebieską kropkę „jesteś tutaj”
        },
        () => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 },
      );
    }
    map.once("load", centerOnMe);

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const mapLoaded = new Promise((res) => map.on("load", res));

    Promise.all([fetch("/api/config").then((r) => r.json()), fetch("/api/reports").then((r) => r.json()), mapLoaded]).then(([cfg, reports]) => {
      const ops = Object.fromEntries(cfg.operators.map((o) => [o.key, o]));
      const perOp = {};
      let scooters = 0;
      const features = [];
      for (const r of reports) {
        const op = ops[r.operator];
        if (!op) continue;
        scooters += r.scooter_count;
        perOp[r.operator] = (perOp[r.operator] || 0) + r.scooter_count;
        features.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [r.lng, r.lat] },
          properties: { count: r.scooter_count, color: dark ? op.dark : op.color, name: op.name, street: r.street || "", date: r.created_at },
        });
      }
      map.addSource("reports", { type: "geojson", data: { type: "FeatureCollection", features } });
      map.addLayer({
        id: "reports",
        type: "circle",
        source: "reports",
        layout: { "circle-sort-key": ["-", 0, ["get", "count"]] }, // małe kropki na wierzchu
        paint: {
          "circle-radius": ["+", 5, ["*", 4, ["sqrt", ["get", "count"]]]],
          "circle-color": ["get", "color"],
          "circle-opacity": 0.8,
          "circle-stroke-width": 1.5,
          "circle-stroke-color": dark ? "#0a0a0b" : "#ffffff",
        },
      });
      map.on("click", "reports", (e) => {
        const f = e.features[0];
        const p = f.properties;
        new maplibregl.Popup({ offset: 10 })
          .setLngLat(f.geometry.coordinates)
          .setHTML(`<strong>${esc(p.name)}</strong> · ${p.count} szt.<br><span style="opacity:.7">${esc(p.street)}<br>${esc(new Date(p.date).toLocaleDateString("pl-PL"))}</span>`)
          .addTo(map);
      });
      map.on("mouseenter", "reports", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "reports", () => (map.getCanvas().style.cursor = ""));

      document.getElementById("stats").textContent = `${reports.length} zgłoszeń · ${scooters} hulajnóg`;
      document.getElementById("legend").innerHTML = cfg.operators
        .map((o) => `<li class="flex items-center gap-1.5"><span class="dot" style="background:${dark ? o.dark : o.color}"></span>${esc(o.name)}${perOp[o.key] ? ` <span class="text-muted">${perOp[o.key]}</span>` : ""}</li>`)
        .join("");
    });
  </script>
</body>
</html>
